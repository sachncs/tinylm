[project]
name = "tinylm"
version = "0.2.0"
description = "Sub-50M-parameter language model search for the BabyLM 2026 benchmark."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
    "tokenizers",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]
official = [
    "datasets>=5.1.0",
    "lm-eval>=0.4.13",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "e2e: end-to-end tests that run the full pipeline on tiny fixtures",
]

[tool.ruff]
line-length = 80
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "PL", "BLE", "S110", "S112", "PGH", "RUF100", "W"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnnecessaryTypeIgnoreComment = true
