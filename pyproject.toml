[project]
name = "tinylm"
version = "0.2.0"
description = "Sub-50M-parameter language model search for the BabyLM 2026 benchmark."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets",
    "lm-eval",
    "tokenizers",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests that run the full pipeline on tiny fixtures",
]

[tool.ruff]
line-length = 80
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "PL"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnknownMemberType = false
