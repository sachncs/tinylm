# Replicated 4-epoch confirmation of the frozen Strict-Small candidate:
# dropout 0 vs 0.1, three seeds each (1 epoch cannot judge dropout).
base = "configs/small.toml"

[[run]]
name = "d00s0"
set = ["train.epochs=4", "train.seed=0", "model.dropout=0.0", "train.compile=true"]

[[run]]
name = "d00s1"
set = ["train.epochs=4", "train.seed=1", "model.dropout=0.0", "train.compile=true"]

[[run]]
name = "d00s2"
set = ["train.epochs=4", "train.seed=2", "model.dropout=0.0", "train.compile=true"]

[[run]]
name = "d01s0"
set = ["train.epochs=4", "train.seed=0", "model.dropout=0.1", "train.compile=true"]

[[run]]
name = "d01s1"
set = ["train.epochs=4", "train.seed=1", "model.dropout=0.1", "train.compile=true"]

[[run]]
name = "d01s2"
set = ["train.epochs=4", "train.seed=2", "model.dropout=0.1", "train.compile=true"]
