# Strict candidate (built from the Strict-Small decisions) (about 12.9M parameters), decided from the screen and
# the 2^5 factorial (docs/architecture.md). Epochs are set per experiment;
# 1 here is the screening pass. Dropout and weight decay await multi-epoch runs.
name = "strict"
data = "runs/strict16k"
out = "runs/final/strict"
evals = ["data/evals/evaluation_data/fast_eval/blimp_fast"]
taus = [0.5, 1.0, 2.0]

[model]
max_seq_len = 256
d_model = 256
n_layers = 11
n_heads = 4
window = 128
global_every = 1
norm = "rms"
activation = "gelu"
tie_embeddings = true
dropout = 0.0
recency = true
exclusive = [3, 4, 5, 6, 7]

[train]
seq_len = 256
batch = 32
lr = 0.003
floor = 0.1
warmup = 200
decay = 0.1
clip = 1.0
epochs = 1
seed = 0
device = "mps"
every = 1000
schedule = "wsd"
optimizer = "muon"
