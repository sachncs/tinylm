# Reference arm for the 1-epoch screens: full attention, GELU, RMSNorm, tied head.
name = "proxy"
data = "runs/small8k"
out = "runs/screen/proxy"
evals = ["data/evals/evaluation_data/fast_eval/blimp_fast"]
taus = [0.5, 1.0, 2.0]

[model]
max_seq_len = 256
d_model = 256
n_layers = 6
n_heads = 4
window = 128
global_every = 1

[train]
seq_len = 256
batch = 32
lr = 0.002
floor = 0.1
warmup = 300
decay = 0.1
clip = 1.0
epochs = 1
seed = 0
device = "mps"
every = 500
schedule = "wsd"
